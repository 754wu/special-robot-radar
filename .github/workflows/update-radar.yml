name: Update Special Robot Radar
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  schedule:
    # 01:15 UTC = 09:15 Beijing / 10:15 Tokyo. Scheduled triggers are best effort.
    - cron: '15 1 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  build-and-publish:
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, classify, render
        env:
          OPENAI_API_KEY: ${{ secrets.RADAR_MODEL_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.RADAR_MODEL_BASE_URL }}
          OPENAI_MODEL: ${{ vars.RADAR_MODEL_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RADAR_CONTACT_EMAIL: ${{ vars.RADAR_CONTACT_EMAIL }}
        run: python main.py
      - name: Recover historical archive
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RADAR_CONTACT_EMAIL: ${{ vars.RADAR_CONTACT_EMAIL }}
        run: python backfill.py --openalex-budget 14 --crossref-budget 5 --max-seconds 520
      - name: Audit all classified resources
        run: python audit_classifications.py
      - name: Commit public archive (without credentials)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "Update robotics radar" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
