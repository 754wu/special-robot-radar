name: Update Special Robot Radar
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  schedule:
    # 01:15 UTC = 09:15 Beijing / 10:15 Tokyo. Scheduled triggers are best effort.
    - cron: '15 1 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py taxonomy.py embodied_topics.py llm_review.py audit_classifications.py backfill.py
      - run: python -m unittest discover -s tests -v
  build-and-publish:
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, classify, render
        env:
          OPENAI_API_KEY: ''
          OPENAI_BASE_URL: ${{ vars.RADAR_MODEL_BASE_URL }}
          OPENAI_MODEL: ''
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RADAR_CONTACT_EMAIL: ${{ vars.RADAR_CONTACT_EMAIL }}
        run: python main.py
      - name: Recover historical archive
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RADAR_CONTACT_EMAIL: ${{ vars.RADAR_CONTACT_EMAIL }}
        run: python backfill.py --openalex-budget 14 --crossref-budget 5 --max-seconds 520
      - name: Free OpenRouter advisory review (cached, no paid fallback)
        env:
          RADAR_MODEL_API_KEY: ${{ secrets.RADAR_MODEL_API_KEY }}
          RADAR_LLM_REQUEST_BUDGET: '40'
        run: python llm_review.py
      - name: Audit all classified resources
        run: python audit_classifications.py
      - name: Commit public archive (without credentials)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No archive changes to publish"
          else
            git commit -m "Update robotics radar"
            # Keep the generated docs from this run, while incorporating any
            # commits added to main during the long collection/backfill job.
            # Never force-push and never overwrite concurrent source changes.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                git rebase --abort || true
                echo "Rebase conflict: refusing to overwrite remote changes"
                exit 1
              fi
              sleep $((attempt * 3))
            done
            echo "Could not publish after 3 non-force retries"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
